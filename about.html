    <style>
        /* ============================================================
               Brutalist Avant-Garde Design System — Neon-Void Theme
               ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b0b0;
            --accent-neon: #00ff88;
            --accent-neon-dim: #00cc6a;
            --accent-magenta: #ff006e;
            --accent-cyan: #00f0ff;
            --accent-yellow: #ffe600;
            --border-thick: 4px solid var(--accent-neon);
            --border-thin: 2px solid var(--accent-neon-dim);
            --shadow-neon: 0 0 30px rgba(0, 255, 136, 0.3);
            --shadow-magenta: 0 0 30px rgba(255, 0, 110, 0.25);
            --font-main: 'Courier New', 'Nanum Gothic Coding', monospace;
            --font-heading: 'Impact', 'Arial Black', sans-serif;
            --spacing-unit: 8px;
            --card-radius: 0px;
            --transition-speed: 0.2s;
            --max-width: 1280px;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 16px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- TYPOGRAPHY ---------- */
        h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.8rem, 8vw, 5.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.92;
            color: var(--text-primary);
            text-shadow: 4px 4px 0 var(--accent-magenta), -2px -2px 0 var(--accent-cyan);
            margin-bottom: var(--spacing-unit);
        }

        h2 {
            font-family: var(--font-heading);
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-neon);
            border-left: var(--border-thick);
            padding-left: 16px;
            margin-bottom: calc(var(--spacing-unit) * 3);
            position: relative;
        }

        h2::after {
            content: '◆';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-magenta);
            font-size: 1.5rem;
        }

        h3 {
            font-family: var(--font-heading);
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: var(--spacing-unit);
        }

        p {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            max-width: 72ch;
            margin-bottom: 1.2rem;
        }

        a {
            color: var(--accent-neon);
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
            transition: color var(--transition-speed) ease, text-shadow var(--transition-speed) ease;
        }

        a:hover {
            color: var(--text-primary);
            text-shadow: 0 0 20px var(--accent-neon);
        }

        /* ---------- LAYOUT ---------- */
        .container {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ---------- NAVIGATION ---------- */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--bg-secondary);
            border-bottom: var(--border-thin);
            z-index: 1000;
            padding: 8px 0;
        }

        .nav .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .nav-brand {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--accent-neon);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            padding: 4px 12px;
            border: 2px solid var(--accent-neon-dim);
            background: rgba(0, 255, 136, 0.05);
        }

        .nav-links {
            display: flex;
            gap: 4px;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links li a {
            display: block;
            padding: 8px 16px;
            font-family: var(--font-main);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-decoration: none;
            border: 2px solid transparent;
            transition: all var(--transition-speed) ease;
        }

        .nav-links li a:hover,
        .nav-links li a.active {
            color: var(--text-primary);
            border-color: var(--accent-neon);
            background: rgba(0, 255, 136, 0.1);
            text-shadow: 0 0 10px var(--accent-neon);
        }

        .nav-toggle {
            display: none;
            background: none;
            border: 2px solid var(--accent-neon-dim);
            color: var(--accent-neon);
            padding: 8px 12px;
            font-size: 1.5rem;
            cursor: pointer;
            font-family: var(--font-main);
            transition: border-color var(--transition-speed);
        }

        .nav-toggle:hover {
            border-color: var(--accent-neon);
        }

        /* ---------- HERO SECTION ---------- */
        .hero {
            padding: 100px 0 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle at 30% 40%, rgba(0, 255, 136, 0.08), transparent 70%);
            pointer-events: none;
        }

        .hero h1 {
            margin-bottom: var(--spacing-unit);
        }

        .hero .subtitle {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: calc(var(--spacing-unit) * 2);
        }

        .hero .meta-data {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-top: var(--border-thin);
            padding-top: calc(var(--spacing-unit) * 2);
            margin-top: calc(var(--spacing-unit) * 2);
        }

        .hero .meta-data span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero .meta-data strong {
            color: var(--accent-cyan);
        }

        /* ---------- CARD GRID / DATA BLOCKS ---------- */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .card {
            background: var(--bg-card);
            border: var(--border-thin);
            padding: 24px;
            position: relative;
            transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
        }

        .card:hover {
            border-color: var(--accent-neon);
            box-shadow: var(--shadow-neon);
        }

        .card .card-label {
            position: absolute;
            top: -12px;
            left: 16px;
            background: var(--bg-primary);
            padding: 0 12px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-magenta);
            border: 2px solid var(--accent-magenta);
        }

        .card h3 {
            margin-top: 8px;
            font-size: 1.6rem;
        }

        .card .stat {
            font-size: 2.8rem;
            font-family: var(--font-heading);
            color: var(--accent-neon);
            line-height: 1;
            margin: 12px 0 8px;
        }

        .card p {
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .card .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 16px;
        }

        .tag {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-neon-dim);
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-neon);
        }

        /* ---------- TABLE (데이터 시각화 느낌) ---------- */
        .data-table-wrap {
            overflow-x: auto;
            margin: 40px 0;
            border: var(--border-thin);
            background: var(--bg-card);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            background: var(--bg-secondary);
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-neon);
            padding: 16px 12px;
            text-align: left;
            border-bottom: var(--border-thick);
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }

        tr:hover td {
            background: rgba(0, 255, 136, 0.03);
        }

        td:first-child {
            font-weight: 700;
            color: var(--text-primary);
        }

        .rank-badge {
            display: inline-block;
            background: var(--accent-neon);
            color: var(--bg-primary);
            font-weight: 900;
            padding: 2px 10px;
            font-size: 0.8rem;
        }

        /* ---------- INFO / DETAIL SECTIONS ---------- */
        .info-section {
            padding: 60px 0;
            border-bottom: var(--border-thin);
        }

        .info-section:last-of-type {
            border-bottom: none;
        }

        .info-content {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            align-items: flex-start;
        }

        .info-text {
            flex: 2;
            min-width: 280px;
        }

        .info-sidebar {
            flex: 1;
            min-width: 220px;
            background: var(--bg-card);
            border: var(--border-thin);
            padding: 24px;
            position: sticky;
            top: 80px;
        }

        .info-sidebar h4 {
            font-family: var(--font-heading);
            font-size: 1rem;
            text-transform: uppercase;
            color: var(--accent-magenta);
            margin-bottom: 12px;
        }

        .info-sidebar ul {
            list-style: none;
        }

        .info-sidebar ul li {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
        }

        .info-sidebar ul li::before {
            content: '▸ ';
            color: var(--accent-neon);
        }

        /* ---------- FAQ ACCORDION (단순한 리스트로 대체) ---------- */
        .faq-list {
            display: grid;
            gap: 16px;
        }

        .faq-item {
            background: var(--bg-card);
            border: var(--border-thin);
            padding: 20px 24px;
        }

        .faq-item .question {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            margin-bottom: 8px;
            display: flex;
</body>
